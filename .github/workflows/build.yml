name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run Scripts
      shell: powershell
      run: |
        cd native
        .\bootstrap.ps1
        .\build.ps1
        .\build-installer.ps1

    - name: Upload Setup File
      uses: actions/upload-artifact@v4
      with:
        name: justice-launcher-setup
        path: native/dist-native/justice-launcher-setup.exe
