name: Build Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js (For Installer Assets)
      uses: actions/setup-node@v4
      with:
        node-node: '20'

    - name: Install Node Dependencies & Generate Bitmaps
      run: |
        npm install
        node build/generate-installer-bitmaps.js
      continue-on-error: true

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run Launcher Scripts
      shell: powershell
      run: |
        cd native
        .\bootstrap.ps1
        .\build.ps1
        .\build-installer.ps1

    - name: Upload Setup File
      uses: actions/upload-artifact@v4
      with:
        name: justice-launcher-setup
        path: native/dist-native/justice-launcher-setup.exe
